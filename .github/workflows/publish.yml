name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write
  id-token: write  # required so NuGet/login can request a GitHub OIDC token for Trusted Publishing

jobs:
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ROP.sln

      - name: Build (Release)
        run: dotnet build ROP.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --project Test/Test.fsproj --configuration Release

      - name: Extract version from tag
        id: version
        # Strips a single leading 'v' or 'V' (tags in this repo have historically used both), so
        # "V1.0.0" and "v1.0.0" both yield "1.0.0" -- required for a valid NuGet PackageVersion.
        run: echo "VERSION=${GITHUB_REF_NAME#[vV]}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet package
        run: >
          dotnet pack ROP/ROP.fsproj
          --configuration Release
          --no-build
          -p:PackageVersion=${{ steps.version.outputs.VERSION }}
          --output nupkgs

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: nupkgs/*.nupkg
          retention-days: 90

      # Trusted Publishing: exchanges this job's short-lived GitHub OIDC token for a temporary
      # (~1 hour) NuGet API key, so no long-lived NUGET_API_KEY secret needs to be stored/rotated.
      # Requires a Trusted Publishing policy configured at nuget.org (username -> Trusted Publishing)
      # for Repository Owner "GianFossi", Repository "ROP", Workflow File "publish.yml".
      - name: NuGet login (OIDC -> temp API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile/username, NOT your email address

      - name: Push to NuGet.org
        run: >
          dotnet nuget push nupkgs/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Zip DLL output
        run: >
          zip -j nupkgs/ROP-${{ steps.version.outputs.VERSION }}-dll.zip
          ROP/bin/Release/net8.0/ROP.dll
          ROP/bin/Release/net8.0/ROP.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            nupkgs/*.nupkg
            nupkgs/*-dll.zip
