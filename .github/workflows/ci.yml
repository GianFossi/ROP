name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ROP.sln

      - name: Build (Release)
        run: dotnet build ROP.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --project Test/Test.fsproj --configuration Release

      - name: Publish DLL (Release)
        run: >
          dotnet publish ROP/ROP.fsproj
          --configuration Release
          --no-build
          --output publish

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: ROP-dll
          path: publish/
          retention-days: 30
